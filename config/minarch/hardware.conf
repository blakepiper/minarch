# shellcheck shell=bash
# These variables are consumed by minarch-hardware-hotplug.
# shellcheck disable=SC2034
# Per-machine settings. Empty keyboard_name or mirror_output disables that feature.
keyboard_name='Gaming Keyboard'
keyboard_vendor=1fc9
keyboard_product=e8c7
keyboard_layout=us
keyboard_options=(terminate:ctrl_alt_bksp altwin:swap_alt_win)
keyboard_interfaces=2

mirror_output=HDMI-2
mirror_source=eDP-1
mirror_mode=1920x1080
mirror_rate=60
