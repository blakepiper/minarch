# Minimal compositor profile with fully opaque windows.
# Keep rendering on X11's XRender path and disable visual effects.
backend = "xrender";
vsync = true;
# Redraw the complete frame to avoid stale regions after display power changes.
use-damage = false;
unredir-if-possible = false;

shadow = false;
fading = false;
blur-background = false;
corner-radius = 0;

# Force full opacity for every window, including client opacity requests.
rules = (
  { unredir = false; },
  { opacity = 1.0; opacity-override = true; } # @minarch-opacity-override@
);
