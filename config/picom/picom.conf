# Minimal compositor profile with fully opaque windows.
# Keep rendering on X11's XRender path and disable visual effects.
backend = "xrender";
vsync = false;
use-damage = true;

shadow = false;
fading = false;
blur-background = false;
corner-radius = 0;

# Force full opacity for every window, including client opacity requests.
rules = (
  {
    opacity = 1.0;
    opacity-override = true;
  }
);
